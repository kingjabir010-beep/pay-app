name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Uses a Gradle install managed by the action instead of a checked-in
      # gradlew wrapper jar, so there's nothing binary to keep in the repo.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.6

      - name: Build debug APK (installable immediately, for testing)
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: piprapay-lite-forwarder-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Build release APK (unsigned)
        run: gradle assembleRelease --stacktrace

      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: piprapay-lite-forwarder-release-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
